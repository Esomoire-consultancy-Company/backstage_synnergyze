name: Verify FOSSA
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install FOSSA
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh \
            | bash -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/fossa" --version

      - name: Verify FOSSA API key
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          if [ -z "$FOSSA_API_KEY" ]; then
            echo "::error::FOSSA_API_KEY repository secret is not configured"
            exit 1
          fi

      - name: FOSSA Configure & Analyze
        env:
          GITHUB_REF: $GITHUB_REF
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: node scripts/run-fossa.js
