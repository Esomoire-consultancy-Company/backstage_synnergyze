apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: esomoire
  title: Esomoire
  description: Parent organization for Synnergyze operating contexts.
spec:
  type: organization
  profile:
    displayName: Esomoire
  children:
    - synnergyze-developers
    - synnergyze-client-admins
    - synnergyze-admins

---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: synnergyze-developers
  title: VSR / Synnergyze Developers
  description: VSR-team engineering context for provisioning, integration, deployment, repair, diagnostics, and authorized client support.
spec:
  type: team
  profile:
    displayName: Synnergyze Developers
  parent: esomoire
  children: []

---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: synnergyze-client-admins
  title: Synnergyze Client Admins
  description: Client-side administrators who operate only their own Warden-bounded estate; Genesis controls the network and Synnergyze controls workspaces.
  annotations:
    vsr.synnergyze.io/role: client-admin
    vsr.synnergyze.io/scope: bounded-client-estate
    vsr.synnergyze.io/authority: warden
spec:
  type: team
  profile:
    displayName: Synnergyze Client Admins
  parent: esomoire
  children: []

---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: synnergyze-admins
  title: Synnergyze Estate Admins (Legacy Context)
  description: Estate-wide administration context retained for compatibility; it is not the client Admin role.
  annotations:
    vsr.synnergyze.io/status: legacy-context
    vsr.synnergyze.io/superseded-by: synnergyze-client-admins-for-client-administration
    vsr.synnergyze.io/effective-date: '2026-09-23'
spec:
  type: team
  profile:
    displayName: Synnergyze Estate Admins
  parent: esomoire
  children: []

---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: esomoire-consultancy-company
  title: Faiz Ahmed
  description: Synnergyze Backstage principal with developer as the default operating context.
  annotations:
    github.com/user-login: Esomoire-consultancy-Company
    github.com/user-id: '193629930'
    vsr.synnergyze.io/default-context: developer
    vsr.synnergyze.io/roles: developer
    vsr.synnergyze.io/team: vsr
spec:
  profile:
    displayName: Faiz Ahmed
    email: faiz@esomoire.com
  memberOf:
    - synnergyze-developers

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: logic-erp-stock-provider
  title: LOGIC ERP Stock Provider
  description: External read-only provider boundary for GetStockInHand. Live provider authentication remains pending.
  annotations:
    vsr.synnergyze.io/provider: logic-erp
    vsr.synnergyze.io/operation: GetStockInHand
    vsr.synnergyze.io/access-mode: read-only
    vsr.synnergyze.io/binding-state: registered-pending-binding
spec:
  type: external-service
  owner: group:default/synnergyze-developers
  system: synnergyze-client-assurance-cockpit

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: voi-logic-stock-developer-runtime
  title: VOI LOGIC Stock Developer Runtime
  description: Developer-owned Backstage component for the governed LOGIC stock read, DataWeave R0.3 transform, Warden authorization, and River evidence path on Alpha.
  tags:
    - developer
    - voi
    - logic-erp
    - dataweave
    - warden
    - riveros
    - alpha
  annotations:
    github.com/project-slug: Esomoire-consultancy-Company/backstage_synnergyze
    vsr.synnergyze.io/context: developer
    vsr.synnergyze.io/runtime-node: ALPHA-NODE-001
    vsr.synnergyze.io/provider-binding: pending
    vsr.synnergyze.io/warden-state: live-qualified
    vsr.synnergyze.io/river-state: live
    vsr.synnergyze.io/dataweave-transform: logic.stock.to.inventory-R0.3
spec:
  type: service
  lifecycle: experimental
  owner: group:default/synnergyze-developers
  system: synnergyze-client-assurance-cockpit
  dependsOn:
    - resource:default/logic-erp-stock-provider
